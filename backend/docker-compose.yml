services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: esquenta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: esquenta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  evolution-go-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_GO_DB_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: postgres
    volumes:
      - evolution_go_postgres_data:/var/lib/postgresql/data
      - ./evolution-go-init.sql:/docker-entrypoint-initdb.d/evolution-go-init.sql:ro

  evolution-go-node1:
    image: ${EVOLUTION_GO_IMAGE:-evoapicloud/evolution-go:0.7.2}
    restart: unless-stopped
    depends_on:
      - evolution-go-postgres
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: esquenta-node1
      GLOBAL_API_KEY: ${EVOLUTION_GO_NODE1_API_KEY:-CHANGE_ME}
      POSTGRES_AUTH_DB: postgresql://evolution:${EVOLUTION_GO_DB_PASSWORD:-CHANGE_ME}@evolution-go-postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evolution:${EVOLUTION_GO_DB_PASSWORD:-CHANGE_ME}@evolution-go-postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "false"
      MINIO_ENABLED: "false"
      WADEBUG: INFO
      LOGTYPE: console
      OS_NAME: Esquenta
      QRCODE_MAX_COUNT: "30"
      EVOLUTION_OPERATOR_EMAIL: ${EVOLUTION_OPERATOR_EMAIL:-}
    volumes:
      - evolution_go_data:/app/dbdata
      - evolution_go_logs:/app/logs
    ports:
      - "8080:8080"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
      - evolution-go-node1
    command: >
      sh -c "prisma db push && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
      - evolution-go-node1
    command: ["arq", "src.worker.WorkerSettings"]

volumes:
  postgres_data:
  redis_data:
  evolution_go_postgres_data:
  evolution_go_data:
  evolution_go_logs:
